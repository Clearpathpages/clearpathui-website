# Netlify settings for www.clearpathui.com
# Static site: no build step, publish the repository root.

[build]
  publish = "."
  command = ""

# Keep internal docs and repo files off the public site.
[[redirects]]
  from = "/PLATFORMS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

# /quote and /pay work through Netlify's clean URLs; pages use them as canonical addresses.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# No custom Cache-Control: Netlify's default makes browsers re-check files on
# each visit, so updates to styles.css / main.js show up right after a deploy.
